# Requêtes de supervision propres au pipeline, ajoutées aux métriques que
# postgres-exporter collecte déjà (disponibilité, connexions, transactions...).
#
# Le nom d'une métrique est la concaténation de la clé et du nom de colonne :
# "pipeline_clean" + "rows" donne pipeline_clean_rows.

# Côté « Clean » de l'indicateur Raw vs Clean : ce qui est réellement en base.
pipeline_clean:
  query: 'SELECT table_name AS "table", row_count AS rows FROM mart.v_clean_counts'
  master: true
  metrics:
    - table:
        usage: "LABEL"
        description: "Table du schéma mart"
    - rows:
        usage: "GAUGE"
        description: "Lignes propres chargées dans PostgreSQL"

# Bilan de la dernière exécution de chaque job Spark.
# La colonne "job" est renommée : Prometheus réserve ce nom d'étiquette pour
# la cible scrutée et renommerait la nôtre en exported_job.
pipeline_load_run:
  query: >
    SELECT job AS pipeline_job,
           coalesce(raw_rows_in, 0)::float        AS raw_rows_in,
           coalesce(distinct_movies_in, 0)::float AS distinct_movies_in,
           coalesce(clean_rows_out, 0)::float     AS clean_rows_out,
           coalesce(rejected_rows, 0)::float      AS rejected_rows,
           coalesce(imdb_matched, 0)::float       AS imdb_matched,
           coalesce(duration_seconds, 0)::float   AS duration_seconds,
           coalesce(extract(epoch FROM (now() - finished_at)), 0)::float AS age_seconds,
           (status = 'success')::int::float       AS success
    FROM mart.v_raw_vs_clean
  master: true
  metrics:
    - pipeline_job:
        usage: "LABEL"
        description: "Job Spark : aggregate ou load_mart"
    - raw_rows_in:
        usage: "GAUGE"
        description: "Lignes brutes lues par la dernière exécution"
    - distinct_movies_in:
        usage: "GAUGE"
        description: "Films distincts après dédoublonnage"
    - clean_rows_out:
        usage: "GAUGE"
        description: "Lignes propres produites par la dernière exécution"
    - rejected_rows:
        usage: "GAUGE"
        description: "Lignes écartées faute d'identifiant ou de titre"
    - imdb_matched:
        usage: "GAUGE"
        description: "Films rapprochés d'une note IMDb"
    - duration_seconds:
        usage: "GAUGE"
        description: "Durée de la dernière exécution"
    - age_seconds:
        usage: "GAUGE"
        description: "Temps écoulé depuis la fin de la dernière exécution"
    - success:
        usage: "GAUGE"
        description: "1 si la dernière exécution a réussi"

# Contrôle qualité (TP3) : bilan de chaque contrôle à la dernière exécution
# de l'étape quality, avant (mart) et après (curated) nettoyage. Les vues
# dq.* n'existent qu'après le premier passage de l'étape : d'ici là, ces deux
# requêtes échouent sans gêner les autres métriques.
pipeline_dq_control:
  query: >
    SELECT r.control_id, c.dimension, c.severity, r.phase,
           r.anomaly_rows::float                 AS anomalies,
           coalesce(r.anomaly_rate, 0)::float    AS anomaly_rate,
           coalesce(r.passed, true)::int::float  AS passed
    FROM dq.v_last_run l
    JOIN dq.results r  ON r.run_id = l.run_id
    JOIN dq.controls c ON c.control_id = r.control_id
  master: true
  metrics:
    - control_id:
        usage: "LABEL"
        description: "Identifiant du contrôle dans la matrice (ex. VAL-13)"
    - dimension:
        usage: "LABEL"
        description: "Complétude, unicité, validité, cohérence ou intégrité"
    - severity:
        usage: "LABEL"
        description: "Sévérité : critique, majeure, mineure ou info"
    - phase:
        usage: "LABEL"
        description: "avant (mart) ou après (curated) nettoyage"
    - anomalies:
        usage: "GAUGE"
        description: "Lignes en anomalie"
    - anomaly_rate:
        usage: "GAUGE"
        description: "Part des lignes contrôlées en anomalie"
    - passed:
        usage: "GAUGE"
        description: "1 si le taux d'anomalies est sous le seuil toléré"

# Score par dimension (100 = aucune anomalie) et nombre de contrôles sous le seuil.
pipeline_dq_dimension:
  query: >
    SELECT coalesce(dimension, 'global') AS dimension, phase,
           score::float           AS score,
           controls::float        AS controls,
           controls_passed::float AS controls_passed
    FROM dq.v_dimension_scores
  master: true
  metrics:
    - dimension:
        usage: "LABEL"
        description: "Dimension de qualité, ou global"
    - phase:
        usage: "LABEL"
        description: "avant (mart) ou après (curated) nettoyage"
    - score:
        usage: "GAUGE"
        description: "Moyenne des taux de conformité des contrôles, en %"
    - controls:
        usage: "GAUGE"
        description: "Contrôles évaluables"
    - controls_passed:
        usage: "GAUGE"
        description: "Contrôles sous leur seuil toléré"
