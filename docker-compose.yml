# Plateforme Data du TP2 : collecte -> Kafka -> Data Lake -> PySpark -> PostgreSQL -> Data Viz,
# le tout supervisé par Prometheus et Grafana. Tout démarre avec "docker compose up -d".
# Les ports ne sont publiés que sur 127.0.0.1 : rien n'est exposé sur le réseau local.

services:

  # ===================================================================
  # Stockage
  # ===================================================================

  postgres:
    image: postgres:17
    container_name: tmdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmdb}
      POSTGRES_DB: ${POSTGRES_DB:-tmdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les scripts de ce dossier sont exécutés au premier démarrage (volume vide)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applique la DDL du schéma mart puis s'arrête. Rejoué à chaque démarrage :
  # indispensable car les scripts de db/init ne s'exécutent que sur un volume
  # vierge, et le volume pgdata existe depuis le TP1.
  db-migrate:
    image: postgres:17
    container_name: tmdb_db_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tmdb}
      PGPASSWORD: ${POSTGRES_PASSWORD:-tmdb}
      PGDATABASE: ${POSTGRES_DB:-tmdb}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - /bin/sh
      - -c
      - 'set -e; for f in /migrations/*.sql; do echo "== $$f"; psql -v ON_ERROR_STOP=1 -f "$$f"; done; echo "migrations appliquées"'

  # ===================================================================
  # Transport — Kafka en mode KRaft (ni ZooKeeper, ni Schema Registry)
  # ===================================================================

  kafka:
    image: apache/kafka:4.1.0
    container_name: tmdb_kafka
    restart: unless-stopped
    environment:
      # Noeud unique : il est à la fois broker et controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-RJnINqC3SNigDRwEGFXbfw}
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Nom résolvable depuis les autres conteneurs : le port n'est pas publié sur l'hôte
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un seul broker : tous les facteurs de réplication tombent à 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Un topic absent doit échouer bruyamment plutôt que d'être créé à la volée
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
    volumes:
      # /var/lib/kafka/data appartient à l'uid 1000 dans l'image : le volume hérite des droits
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Crée le topic puis s'arrête : rejoué (sans effet) à chaque démarrage
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: tmdb_kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-tmdb.movies.raw}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    command: ["/bin/sh", "/create-topics.sh"]

  # ===================================================================
  # Collecte
  # ===================================================================

  # Source 1 : interrogation continue de l'API TMDB, publication dans Kafka
  tmdb-producer:
    build: ./api
    container_name: tmdb_producer
    # on-failure (et non unless-stopped) : un arrêt volontaire après TMDB_MAX_MOVIES
    # doit rester un arrêt, seules les pannes justifient un redémarrage
    restart: on-failure:5
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-fr-FR}
      TMDB_LISTS: ${TMDB_LISTS:-popular,top_rated}
      TMDB_MAX_PAGES: ${TMDB_MAX_PAGES:-10}
      TMDB_MAX_MOVIES: ${TMDB_MAX_MOVIES:-0}
      TMDB_POLL_INTERVAL_SECONDS: ${TMDB_POLL_INTERVAL_SECONDS:-1.0}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-tmdb.movies.raw}
      PRODUCER_STATE_FILE: /state/cursor.json
      METRICS_PORT: 8000
    ports:
      - "127.0.0.1:${TMDB_METRICS_PORT:-9102}:8000"
    volumes:
      # Curseur de collecte : reprise exactement où le producer s'était arrêté
      - producer_state:/state

  # Dépose les messages Kafka tels quels dans la zone raw du Data Lake
  datalake-writer:
    build: ./datalake
    container_name: tmdb_datalake_writer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATALAKE_DIR: /datalake
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-tmdb.movies.raw}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-datalake-writer}
      WRITER_BATCH_SIZE: ${WRITER_BATCH_SIZE:-200}
      WRITER_FLUSH_SECONDS: ${WRITER_FLUSH_SECONDS:-60}
      METRICS_PORT: 8000
    ports:
      - "127.0.0.1:${WRITER_METRICS_PORT:-9103}:8000"
    volumes:
      - datalake:/datalake

  # Source 2 : datasets publics IMDb déposés tels quels dans datalake/raw/imdb
  imdb-fetcher:
    build: ./source2
    container_name: tmdb_imdb_fetcher
    restart: unless-stopped
    environment:
      DATALAKE_DIR: /datalake
      IMDB_DATASETS: ${IMDB_DATASETS:-title.ratings}
      IMDB_FETCH_INTERVAL_HOURS: ${IMDB_FETCH_INTERVAL_HOURS:-24}
      METRICS_PORT: 8000
    ports:
      - "127.0.0.1:${IMDB_METRICS_PORT:-9101}:8000"
    volumes:
      - datalake:/datalake

volumes:
  pgdata:
  # Data Lake partagé entre la collecte et Spark
  datalake:
  # Journaux Kafka : le lac reste la source de vérité, mais le broker doit
  # survivre à un redémarrage sans perdre les messages non encore consommés
  kafkadata:
  # Curseur du producer TMDB
  producer_state:
