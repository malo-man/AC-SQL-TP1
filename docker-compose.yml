services:
  postgres:
    image: postgres:17
    container_name: tmdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmdb}
      POSTGRES_DB: ${POSTGRES_DB:-tmdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les scripts de ce dossier sont exécutés au premier démarrage (volume vide)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Source 2 : datasets publics IMDb déposés tels quels dans datalake/raw/imdb
  imdb-fetcher:
    build: ./source2
    container_name: tmdb_imdb_fetcher
    restart: unless-stopped
    environment:
      DATALAKE_DIR: /datalake
      IMDB_DATASETS: ${IMDB_DATASETS:-title.ratings,title.basics}
      IMDB_FETCH_INTERVAL_HOURS: ${IMDB_FETCH_INTERVAL_HOURS:-24}
      METRICS_PORT: 8000
    ports:
      - "127.0.0.1:${IMDB_METRICS_PORT:-9101}:8000"
    volumes:
      - datalake:/datalake

volumes:
  pgdata:
  # Data Lake partagé entre la collecte et Spark
  datalake:
