services:
  postgres:
    image: postgres:17
    container_name: tmdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmdb}
      POSTGRES_DB: ${POSTGRES_DB:-tmdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les scripts de ce dossier sont exécutés au premier démarrage (volume vide)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
